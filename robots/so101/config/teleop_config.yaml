# robots/so101_sim/config/teleop_config.yaml
#
# TeleopPlugin network configuration for local simulation demo.
# Both leader and follower run on the same machine via loopback.
#
# Start leader:   python run_teleop_leader.py
# Start follower: python run_teleop_follower.py

teleop:
  leader_host: 127.0.0.1
  follower_host: 127.0.0.1

  leader_port: 9101
  follower_port: 9102

  control_hz: 30
  image_hz: 10
