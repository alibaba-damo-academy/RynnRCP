config_type: rynnrcp_server_config
version: 1
manifest:
  robot_id: aero_hand_dual
  robot_name: Aero Hand Dual
  capabilities:
    observations: true
    actions: true
    health: true
    resources: false
    data_collection: true
    policy_service: false
integration:
  config: package://rynnrcp_robot_aero_hand/config/robot_integration.yaml
components:
  robot:
    enabled: true
    mode: dual
    embodiment_type: dual_dexterous_hand
    dof: 14
    port: ''
    left_port: /dev/cu.usbmodem101
    right_port: /dev/cu.usbmodem1101
    baudrate: 921600
    homing_on_connect: false
    homing_timeout_s: 175.0
    homing_settle_s: 8.0
