config_type: rynnrcp_robot_integration
version: 1

manifest:
  robot_id: ${manifest.robot_id}
  robot_name: ${manifest.robot_name}
  embodiment_type: bimanual
  capabilities:
    observations: ${manifest.capabilities.observations}
    actions: ${manifest.capabilities.actions}
    health: ${manifest.capabilities.health}
    resources: ${manifest.capabilities.resources}
    data_collection: ${manifest.capabilities.data_collection}
    policy_service: ${manifest.capabilities.policy_service}
  model_refs:
    urdf: null
    mjcf: null
    calibration: null
    assets: []
  metadata:
    n_dof: 12
    joint_order: left_6_then_right_6
    task_keys:
      - observation.state
      - observation.images.front
      - observation.images.left_wrist
      - observation.images.right_wrist
      - action
    joint_names:
      - left_shoulder_pan
      - left_shoulder_lift
      - left_elbow_flex
      - left_wrist_flex
      - left_wrist_roll
      - left_gripper
      - right_shoulder_pan
      - right_shoulder_lift
      - right_elbow_flex
      - right_wrist_flex
      - right_wrist_roll
      - right_gripper
    teleop_value_names:
      - left_shoulder_pan
      - left_shoulder_lift
      - left_elbow_flex
      - left_wrist_flex
      - left_wrist_roll
      - left_gripper
      - right_shoulder_pan
      - right_shoulder_lift
      - right_elbow_flex
      - right_wrist_flex
      - right_wrist_roll
      - right_gripper

components:
  - name: robot
    type: arm
    parent_component: null
    dof: 12
    frame: base
    description: SO101 bimanual hardware, exposed as left 6 + right 6
    enabled: ${components.robot.enabled}
    health:
      frame_rate: 1
      source: &controller_source
        connector: module
        module_name: rynnrcp_robot_so101.controller.SO101BimanualController
        init:
          left_robot_id: ${components.robot.left_robot_id}
          right_robot_id: ${components.robot.right_robot_id}
          left_port: ${components.robot.left_port}
          right_port: ${components.robot.right_port}
          role: ${components.robot.role}
        start: start
        stop: shutdown
        method_name: get_health
    observations:
      - name: joint_state
        type: joint_state
        description: Merged 12-dim positions, left 6 then right 6
        frame_rate: 60
        source:
          <<: *controller_source
          method_name: get_joint_positions
        codec:
          adapter: ProtocolInputAdapter
    actions:
      - name: joint_position
        type: joint_position
        description: Merged 12-dim target, left 6 then right 6
        frame_rate: 60
        input_schema:
          type: object
          fields:
            joint_positions:
              type: array
              items: float
              shape: [12]
              unit: rad
        source:
          <<: *controller_source
          method_name: set_joint_positions
        codec:
          adapter: ProtocolActionOutputAdapter
      - name: home
        type: prearranged
        description: Move both SO101 follower arms to home
        frame_rate: 1
        source:
          <<: *controller_source
          method_name: go_home
        codec:
          adapter: ProtocolActionOutputAdapter
      - name: move_to
        type: custom
        description: Interpolate both SO101 arms to one merged 12-dim target
        frame_rate: 1
        input_schema:
          type: object
          fields:
            joint_positions:
              type: array
              items: float
              shape: [12]
              unit: rad
        source:
          <<: *controller_source
          method_name: move_to
        codec:
          adapter: ProtocolActionOutputAdapter
      - name: preset_motion
        type: custom
        description: Replay a SO101 validation motion on left, right, or both arms
        frame_rate: 1
        input_schema:
          type: object
          fields:
            motion:
              type: integer
              description: Preset motion id, 1-5
            target:
              type: string
              description: left, right, or both
            duration_s:
              type: float
            fps:
              type: integer
        source:
          <<: *controller_source
          method_name: preset_motion
        codec:
          adapter: ProtocolActionOutputAdapter
      - name: stop_motion
        type: prearranged
        description: Cancel motion on both SO101 arms
        frame_rate: 1
        source:
          <<: *controller_source
          method_name: stop_motion
        codec:
          adapter: ProtocolActionOutputAdapter

  - name: front
    type: camera
    parent_component: robot
    frame: front_camera
    description: Shared front camera
    enabled: ${components.front_camera.enabled}
    observations:
      - name: image
        type: image
        frame_rate: 30
        source:
          connector: port
          port_type: cameras.usb_camera.USBCamera
          init:
            name: front_camera
            device_id: ${components.front_camera.device_id}
            width: 640
            height: 360
            encoding: jpg
            fps: 30
            rotate: 0
            native_compressed: true
            capture_backend: auto
          method_name: read
        codec:
          adapter: ProtocolImageInputAdapter

  - name: left_wrist
    type: camera
    parent_component: robot
    frame: left_wrist_camera
    description: Left wrist camera
    enabled: ${components.left_wrist_camera.enabled}
    observations:
      - name: image
        type: image
        frame_rate: 30
        source:
          connector: port
          port_type: cameras.usb_camera.USBCamera
          init:
            name: left_wrist_camera
            device_id: ${components.left_wrist_camera.device_id}
            width: 640
            height: 360
            encoding: jpg
            fps: 30
            rotate: 0
            native_compressed: true
            capture_backend: auto
          method_name: read
        codec:
          adapter: ProtocolImageInputAdapter

  - name: right_wrist
    type: camera
    parent_component: robot
    frame: right_wrist_camera
    description: Right wrist camera
    enabled: ${components.right_wrist_camera.enabled}
    observations:
      - name: image
        type: image
        frame_rate: 30
        source:
          connector: port
          port_type: cameras.usb_camera.USBCamera
          init:
            name: right_wrist_camera
            device_id: ${components.right_wrist_camera.device_id}
            width: 640
            height: 360
            encoding: jpg
            fps: 30
            rotate: 0
            native_compressed: true
            capture_backend: auto
          method_name: read
        codec:
          adapter: ProtocolImageInputAdapter
