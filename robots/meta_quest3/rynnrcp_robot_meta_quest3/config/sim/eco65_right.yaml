manifest:
  robot_name: Meta Quest 3 → RealMan ECO65
components:
  robot:
    target_model: eco65
    target_urdf: package://rynnrcp_robot_meta_quest3/models/eco65.urdf
    target_dof: 6
    has_gripper: false
    base_link: baselink
    tip_link: Link6
    controller_side: right
    # Web 仿真中部姿态，用于获得双向 Cartesian 调试空间。
    home_joint_positions: [0.0, 0.02, 1.46, 0.09, 1.35, 0.0]
    workspace_delta_limits_m:
      - [-0.25, 0.25]
      - [-0.25, 0.25]
      - [-0.25, 0.25]
    translation_scale: 1.0
