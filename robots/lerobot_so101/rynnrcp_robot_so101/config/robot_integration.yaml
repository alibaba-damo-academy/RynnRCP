config_type: rynnrcp_robot_integration
version: 1

manifest:
  robot_id: ${manifest.robot_id}
  robot_name: ${manifest.robot_name}
  embodiment_type: single_arm
  capabilities:
    observations: ${manifest.capabilities.observations}
    actions: ${manifest.capabilities.actions}
    health: ${manifest.capabilities.health}
    resources: ${manifest.capabilities.resources}
    data_collection: ${manifest.capabilities.data_collection}
    policy_service: ${manifest.capabilities.policy_service}
  model_refs:
    urdf: null
    mjcf: null
    calibration: null
    assets: []
  metadata: {}

components:
  - name: robot
    type: arm
    parent_component: null
    dof: 6
    frame: base
    description: SO101 arm hardware
    enabled: ${components.robot.enabled}
    health:
      frame_rate: 1
      source:
        connector: module
        module_name: rynnrcp_robot_so101.controller.SO101Controller
        init:
          robot_id: ${manifest.robot_id}
          port: ${components.robot.port}
          role: ${components.robot.role}
        start: start
        stop: shutdown
        method_name: get_health
    observations:
      - name: joint_state
        type: joint_state
        description: Current SO101 arm joint positions
        frame_rate: 60
        source:
          connector: module
          module_name: rynnrcp_robot_so101.controller.SO101Controller
          init:
            robot_id: ${manifest.robot_id}
            port: ${components.robot.port}
            role: ${components.robot.role}
          start: start
          stop: shutdown
          method_name: get_joint_positions
        codec:
          adapter: ProtocolInputAdapter

    actions:
      - name: joint_position
        type: joint_position
        description: Target SO101 arm joint positions
        frame_rate: 60
        source:
          connector: module
          module_name: rynnrcp_robot_so101.controller.SO101Controller
          init:
            robot_id: ${manifest.robot_id}
            port: ${components.robot.port}
            role: ${components.robot.role}
          start: start
          stop: shutdown
          method_name: set_joint_positions
        codec:
          adapter: ProtocolActionOutputAdapter

      - name: home
        type: prearranged
        description: Move SO101 arm to the configured home pose
        frame_rate: 1
        source:
          connector: module
          module_name: rynnrcp_robot_so101.controller.SO101Controller
          init:
            robot_id: ${manifest.robot_id}
            port: ${components.robot.port}
            role: ${components.robot.role}
          start: start
          stop: shutdown
          method_name: go_home
        codec:
          adapter: ProtocolActionOutputAdapter

      - name: move_to
        type: custom
        description: Interpolate SO101 arm to a target joint position
        frame_rate: 1
        input_schema:
          type: object
          fields:
            joint_positions:
              type: array
              items: float
              shape: [dof]
              unit: rad
        source:
          connector: module
          module_name: rynnrcp_robot_so101.controller.SO101Controller
          init:
            robot_id: ${manifest.robot_id}
            port: ${components.robot.port}
            role: ${components.robot.role}
          start: start
          stop: shutdown
          method_name: move_to
        codec:
          adapter: ProtocolActionOutputAdapter

      - name: preset_motion
        type: custom
        description: Replay a short SO101 calibration validation motion
        frame_rate: 1
        input_schema:
          type: object
          fields:
            motion:
              type: integer
              description: RynnMotion-compatible preset motion id, 1-5
            duration_s:
              type: float
              description: Optional finite replay duration in seconds
            fps:
              type: integer
              description: Optional replay frame rate
        source:
          connector: module
          module_name: rynnrcp_robot_so101.controller.SO101Controller
          init:
            robot_id: ${manifest.robot_id}
            port: ${components.robot.port}
            role: ${components.robot.role}
          start: start
          stop: shutdown
          method_name: preset_motion
        codec:
          adapter: ProtocolActionOutputAdapter

      - name: stop_motion
        type: prearranged
        description: Cancel the currently queued SO101 motion sequence
        frame_rate: 1
        source:
          connector: module
          module_name: rynnrcp_robot_so101.controller.SO101Controller
          init:
            robot_id: ${manifest.robot_id}
            port: ${components.robot.port}
            role: ${components.robot.role}
          start: start
          stop: shutdown
          method_name: stop_motion
        codec:
          adapter: ProtocolActionOutputAdapter

  - name: front
    type: camera
    parent_component: robot
    frame: front_camera
    description: Front camera hardware
    enabled: ${components.front_camera.enabled}
    observations:
      - name: image
        type: image
        description: Latest image captured by the front camera
        frame_rate: 30
        source:
          connector: port
          port_type: cameras.usb_camera.USBCamera
          init:
            name: front_camera
            device_id: ${components.front_camera.device_id}
            width: 640
            height: 360
            encoding: jpg
            fps: 30
            rotate: 0
            native_compressed: true
            capture_backend: auto
          method_name: read
        codec:
          adapter: ProtocolImageInputAdapter

  - name: wrist
    type: camera
    parent_component: robot
    frame: wrist_camera
    description: Wrist camera hardware
    enabled: ${components.wrist_camera.enabled}
    observations:
      - name: image
        type: image
        description: Latest image captured by the wrist camera
        frame_rate: 30
        source:
          connector: port
          port_type: cameras.usb_camera.USBCamera
          init:
            name: wrist_camera
            device_id: ${components.wrist_camera.device_id}
            width: 640
            height: 360
            encoding: jpg
            fps: 30
            rotate: 0
            native_compressed: true
            capture_backend: auto
          method_name: read
        codec:
          adapter: ProtocolImageInputAdapter
