config_type: rynnrcp_server_config
version: 1
manifest:
  robot_id: aero_hand_dual_hand_master
  robot_name: Aero Hand Dual-Hand Vision Leader
  capabilities:
    observations: true
    actions: false
    health: true
    resources: false
    data_collection: false
    policy_service: false
integration:
  config: package://rynnrcp_robot_aero_hand/config/camera_master_integration.yaml
components:
  robot:
    enabled: true
    mode: dual
    embodiment_type: dual_dexterous_hand
    dof: 14
    side: right
    camera_index: 0
    fps: 30.0
    hand_landmarker_model: ''
    swap_handedness: true
    camera_width: 640
    camera_height: 360
    frame_server_port: 28412
    min_hand_area: 0.005
    ema_alpha: 0.7
    min_cutoff: 5.0
    beta: 1.3
    d_cutoff: 1.4
    visual: none
