config_type: rynnrcp_robot_integration
version: 1

manifest:
  robot_id: ${manifest.robot_id}
  robot_name: ${manifest.robot_name}
  embodiment_type: mobile_manipulator
  capabilities:
    observations: ${manifest.capabilities.observations}
    actions: ${manifest.capabilities.actions}
    health: ${manifest.capabilities.health}
    resources: ${manifest.capabilities.resources}
    data_collection: ${manifest.capabilities.data_collection}
    policy_service: ${manifest.capabilities.policy_service}
  model_refs:
    urdf: null
    mjcf: null
    calibration: null
    assets: []
  metadata:
    arm_joint_names:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
      - gripper
    teleop_value_names:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
      - gripper
      - base_x_velocity
      - base_y_velocity
      - base_yaw_velocity
    base_command_units: [m/s, m/s, rad/s]

components:
  - name: robot
    type: mobile_manipulator
    parent_component: null
    dof: 9
    frame: base
    description: Combined LeKiwi arm and base teleoperation state
    enabled: ${components.robot.enabled}
    observations:
      - name: joint_state
        type: joint_state
        description: Current six-axis arm state followed by base x, y, and yaw velocity
        frame_rate: 60
        source: &controller_source
          connector: module
          module_name: rynnrcp_robot_lekiwi.controller.LeKiwiController
          init:
            robot_id: ${manifest.robot_id}
            port: ${components.robot.port}
            wheel_radius_m: ${components.robot.wheel_radius_m}
            base_radius_m: ${components.robot.base_radius_m}
            max_wheel_raw: ${components.robot.max_wheel_raw}
            max_x_m_s: ${components.robot.max_x_m_s}
            max_y_m_s: ${components.robot.max_y_m_s}
            max_yaw_rad_s: ${components.robot.max_yaw_rad_s}
            watchdog_timeout_s: ${components.robot.watchdog_timeout_s}
            control_loop_hz: ${components.robot.control_loop_hz}
            state_read_hz: ${components.robot.state_read_hz}
            max_joint_velocity_rad_s: ${components.robot.max_joint_velocity_rad_s}
            max_gripper_velocity_per_s: ${components.robot.max_gripper_velocity_per_s}
            target_timeout_s: ${components.robot.target_timeout_s}
            calibration_dir: ${components.robot.calibration_dir}
            home_on_shutdown: ${components.robot.home_on_shutdown}
          start: start
          stop: shutdown
          method_name: get_joint_positions
        codec:
          adapter: ProtocolInputAdapter
    actions:
      - name: joint_position
        type: joint_position
        description: Target six-axis arm state followed by base x, y, and yaw velocity
        frame_rate: 60
        source:
          <<: *controller_source
          method_name: set_joint_positions
        codec:
          adapter: ProtocolActionOutputAdapter

  - name: front
    type: camera
    parent_component: robot
    frame: front_camera
    description: Front USB camera
    enabled: ${components.front_camera.enabled}
    observations:
      - name: image
        type: image
        description: Front camera 640 x 360 image
        frame_rate: 30
        source:
          connector: port
          port_type: cameras.usb_camera.USBCamera
          init:
            name: front_camera
            device_id: ${components.front_camera.device_id}
            width: 640
            height: 360
            encoding: jpg
            fps: 30
            rotate: ${components.front_camera.rotate}
            native_compressed: true
            capture_backend: auto
          method_name: read
        codec:
          adapter: ProtocolImageInputAdapter

  - name: wrist
    type: camera
    parent_component: robot
    frame: wrist_camera
    description: Wrist USB camera
    enabled: ${components.wrist_camera.enabled}
    observations:
      - name: image
        type: image
        description: Wrist camera 640 x 360 image
        frame_rate: 30
        source:
          connector: port
          port_type: cameras.usb_camera.USBCamera
          init:
            name: wrist_camera
            device_id: ${components.wrist_camera.device_id}
            width: 640
            height: 360
            encoding: jpg
            fps: 30
            rotate: ${components.wrist_camera.rotate}
            native_compressed: true
            capture_backend: auto
          method_name: read
        codec:
          adapter: ProtocolImageInputAdapter
