# robots/so101_sim/config/so101_teleop_leader_config.yaml
#
# Leader (master) arm robot config for teleop simulation demo.
# Uses SimSo101Follower stub: get_joint_positions returns fixed data.
# No outputs configured — unidirectional teleop (no force feedback).

config_type: robot_config
robot_type: so101

servers:
- name: action_server
  inputs:
  - protocol: module
    adapter: ModuleGenericInputAdapter
    params:
      sys_path:
      - ../../rcp_motion/robots/so101/
      module_name: controller.so101_leader_reader.SO101LeaderReader
      init_args:
        robot_name: so101
      start_call:
      - method_name: start
        method_kwargs: {}
      destroy_call:
      - method_name: stop
        method_kwargs: {}
      method_name: get_joint_positions
      method_kwargs: {}
      interval: 0.033
      out_key: observation.state

  outputs: []

- name: sensor_server
  inputs: []
  outputs: []

- name: device_monitor_server
  robot_info:
    robot_name: so101_sim_leader

- name: data_server
