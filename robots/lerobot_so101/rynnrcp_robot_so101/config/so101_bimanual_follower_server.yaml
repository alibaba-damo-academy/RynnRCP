config_type: rynnrcp_server_config
version: 1
manifest:
  robot_id: so101_bimanual_follower
  robot_name: SO101 Bimanual Follower
  capabilities:
    observations: true
    actions: true
    health: true
    resources: true
    data_collection: true
    policy_service: false
integration:
  config: package://rynnrcp_robot_so101/config/robot_integration_bimanual.yaml
components:
  robot:
    enabled: true
    role: follower
    n_dof: 12
    task_keys:
    - observation.state
    - observation.images.front
    - observation.images.left_wrist
    - observation.images.right_wrist
    - action
    left_robot_id: so101_bimanual_follower_left
    right_robot_id: so101_bimanual_follower_right
    left_port: /dev/cu.usbmodem-left-follower
    right_port: /dev/cu.usbmodem-right-follower
  front_camera:
    enabled: true
    device_id: 2
  left_wrist_camera:
    enabled: true
    device_id: 0
  right_wrist_camera:
    enabled: true
    device_id: 1
