config_type: rynnrcp_server_config
version: 1
manifest:
  robot_id: booster_t1
  robot_name: Booster T1
  capabilities:
    observations: true
    actions: true
    health: true
    resources: true
    data_collection: true
    policy_service: false
integration:
  config: package://rynnrcp_robot_booster_t1/config/robot_integration.yaml
server:
  interface:
    host: 0.0.0.0
    port: 0
    local_registry: true
    mdns: false
components:
  robot:
    enabled: true
    net: 127.0.0.1
    domain_id: 0
    max_x: 0.5
    max_y: 0.3
    max_yaw: 0.5
    velocity_duration_s: 0.5
    velocity_hz: 20
