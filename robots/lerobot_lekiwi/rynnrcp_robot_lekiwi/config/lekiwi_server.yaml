config_type: rynnrcp_server_config
version: 1
manifest:
  robot_id: lekiwi
  robot_name: LeKiwi
  capabilities:
    observations: true
    actions: true
    health: true
    resources: true
    data_collection: true
    policy_service: false
integration:
  config: package://rynnrcp_robot_lekiwi/config/robot_integration.yaml
components:
  robot:
    enabled: true
    port: /dev/cu.usbmodem5B141112121
    calibration_dir: null
    control_loop_hz: 60
    state_read_hz: 60
    max_joint_velocity_rad_s: 3.0
    max_gripper_velocity_per_s: 3.0
    target_timeout_s: 0.25
    home_on_shutdown: true
    wheel_radius_m: 0.05
    base_radius_m: 0.125
    max_wheel_raw: 3000
    max_x_m_s: 0.3
    max_y_m_s: 0.3
    max_yaw_rad_s: 1.5707963267948966
    watchdog_timeout_s: 0.5
  front_camera:
    enabled: true
    device_id: 0
    rotate: 180
  wrist_camera:
    enabled: true
    device_id: 1
    rotate: 180
