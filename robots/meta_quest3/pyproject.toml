[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rynnrcp-robot-meta-quest3"
version = "0.1.0"
description = "Meta Quest 3 leader integration for RynnRCP"
requires-python = ">=3.10"
dependencies = [
    "rynnrcp>=0.1.0",
    "pyyaml>=6.0",
]

[project.scripts]
rynnrcp-meta-quest3-sim = "rynnrcp_robot_meta_quest3.web_sim:main"
rynnrcp-meta-quest3-server = "rynnrcp_robot_meta_quest3.server_cli:main"

[project.entry-points."rynnrcp.robots"]
meta_quest3 = "rynnrcp_robot_meta_quest3"

[tool.setuptools.packages.find]
where = ["."]
include = ["rynnrcp_robot_meta_quest3*"]

[tool.setuptools.package-data]
"rynnrcp_robot_meta_quest3" = [
    "config/*.yaml",
    "config/sim/*.yaml",
    "models/*.urdf",
    "models/assets/*/*.stl",
    "models/assets/*/*.STL",
    "THIRD_PARTY_NOTICES.md",
    "web/*.html",
    "web/*.js",
    "web/*.txt",
]
