# RM75 Simulation Server Config (9 DOF, 5 cameras)
config_type: rynnrcp_server_config
version: 1

manifest:
  robot_id: rm75_sim
  robot_name: RM75 Simulation
  capabilities:
    observations: true
    actions: true
    health: true
    resources: true
    data_collection: true
    policy_service: false

integration:
  config: package://rynnrcp_robot_sim/config/robot_integration_rm75.yaml

components:
  robot:
    enabled: true
    robot_id: robot
    n_dof: 9
    server_host: localhost
    server_port: 8080
  front_camera:
    enabled: true
    device_id: camera_front
  wrist_camera:
    enabled: true
    device_id: camera_wrist
  top_camera:
    enabled: true
    device_id: camera_top
  left_camera:
    enabled: true
    device_id: camera_left
  right_camera:
    enabled: true
    device_id: camera_right
