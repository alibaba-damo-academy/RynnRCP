# Aero Hand Simulation v1 Server Config (7 DOF, front camera)
config_type: rynnrcp_server_config
version: 1

manifest:
  robot_id: aero_hand_sim_v1
  robot_name: Aero Hand Simulation v1
  capabilities:
    observations: true
    actions: true
    health: true
    resources: true
    data_collection: true
    policy_service: false

integration:
  config: package://rynnrcp_robot_sim/config/robot_integration_aero_hand.yaml

components:
  robot:
    enabled: true
    robot_id: robot
    n_dof: 7
    server_host: localhost
    server_port: 8080
  front_camera:
    enabled: true
    device_id: camera_front
  top_camera:
    enabled: false
    device_id: camera_top
  left_camera:
    enabled: false
    device_id: camera_left
  right_camera:
    enabled: false
    device_id: camera_right
