[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rynnrcp-app-rynnbot"
version = "0.1.0"
description = "Rynnbot cloud platform communication app for RynnRCP"
requires-python = ">=3.10"
dependencies = [
    "rynnrcp>=0.1.0",
    "rynnrcp-app-common>=0.1.0",
    "paho-mqtt>=2.0",
    "websocket-client>=1.6",
    "protobuf>=5.0",
    "alibabacloud-oss-v2>=1.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.9",
    "Pillow>=9.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.scripts]
rynnrcp-rynnbot-app = "rynnrcp_app_rynnbot.rynnbot_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rynnrcp_app_rynnbot*"]

[tool.setuptools.package-data]
"rynnrcp_app_rynnbot" = ["default_config.yaml"]
"rynnrcp_app_rynnbot.proto" = ["*.proto"]
