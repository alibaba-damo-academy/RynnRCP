config_type: rynnrcp_robot_integration
version: 1

manifest:
  robot_id: ${manifest.robot_id}
  robot_name: ${manifest.robot_name}
  embodiment_type: bimanual
  capabilities:
    observations: ${manifest.capabilities.observations}
    actions: ${manifest.capabilities.actions}
    health: ${manifest.capabilities.health}
    resources: ${manifest.capabilities.resources}
    data_collection: ${manifest.capabilities.data_collection}
    policy_service: ${manifest.capabilities.policy_service}
  model_refs:
    urdf: null
    mjcf: null
    calibration: null
    assets: []
  metadata:
    simulation: true
    sim_engine: isaac_sim
    joint_names:
      - left_shoulder_pan
      - left_shoulder_lift
      - left_elbow_flex
      - left_wrist_flex
      - left_wrist_roll
      - left_gripper
      - right_shoulder_pan
      - right_shoulder_lift
      - right_elbow_flex
      - right_wrist_flex
      - right_wrist_roll
      - right_gripper
    teleop_value_names:
      - left_shoulder_pan
      - left_shoulder_lift
      - left_elbow_flex
      - left_wrist_flex
      - left_wrist_roll
      - left_gripper
      - right_shoulder_pan
      - right_shoulder_lift
      - right_elbow_flex
      - right_wrist_flex
      - right_wrist_roll
      - right_gripper

components:
  - name: robot
    type: arm
    parent_component: null
    dof: 12
    frame: base
    description: >-
      Simulated SO101 bimanual arm pair in Isaac Sim. Internally connects to
      two independent JointManager robots (left_robot/right_robot, 6 DoF
      each), but exposes a SINGLE merged 12-dim observation.state / action
      to RynnRCP and the cloud platform (first 6 = left arm, last 6 = right
      arm) — matching the dataset recording format. State and action are
      NEVER split into separate components.
    enabled: ${components.robot.enabled}
    health:
      frame_rate: 1
      source:
        connector: module
        module_name: rynnrcp_robot_sim.controller.SimBimanualRobotController
        init:
          left_robot_id: ${components.robot.left_robot_id}
          right_robot_id: ${components.robot.right_robot_id}
          server_host: ${components.robot.server_host}
          server_port: ${components.robot.server_port}
          n_dof_per_arm: ${components.robot.n_dof_per_arm}
        start: start
        stop: shutdown
        method_name: get_health
    observations:
      - name: joint_state
        type: joint_state
        description: Merged 12-dim joint positions (left 6 + right 6) from simulation
        frame_rate: 30
        source:
          connector: module
          module_name: rynnrcp_robot_sim.controller.SimBimanualRobotController
          init:
            left_robot_id: ${components.robot.left_robot_id}
            right_robot_id: ${components.robot.right_robot_id}
            server_host: ${components.robot.server_host}
            server_port: ${components.robot.server_port}
            n_dof_per_arm: ${components.robot.n_dof_per_arm}
          start: start
          stop: shutdown
          method_name: get_joint_positions
        codec:
          adapter: ProtocolInputAdapter

    actions:
      - name: joint_position
        type: joint_position
        description: Merged 12-dim target joint positions (left 6 + right 6) sent to simulation
        frame_rate: 30
        input_schema:
          type: object
          fields:
            joint_positions:
              type: array
              items: float
              shape: [12]
              unit: rad
        source:
          connector: module
          module_name: rynnrcp_robot_sim.controller.SimBimanualRobotController
          init:
            left_robot_id: ${components.robot.left_robot_id}
            right_robot_id: ${components.robot.right_robot_id}
            server_host: ${components.robot.server_host}
            server_port: ${components.robot.server_port}
            n_dof_per_arm: ${components.robot.n_dof_per_arm}
          start: start
          stop: shutdown
          method_name: set_joint_positions
        codec:
          adapter: ProtocolActionOutputAdapter

  - name: front
    type: camera
    parent_component: robot
    frame: front_camera
    description: Front camera
    enabled: ${components.front_camera.enabled}
    observations:
      - name: image
        type: image
        description: Front camera image
        frame_rate: 30
        source:
          connector: port
          port_type: rynnrcp_robot_sim.sim_camera.SimCamera
          init:
            name: front_camera
            device_id: ${components.front_camera.device_id}
            width: 640
            height: 360
            encoding: jpg
            fps: 30
            native_compressed: true
            server_host: ${components.robot.server_host}
            server_port: ${components.robot.server_port}
          method_name: read
        codec:
          adapter: ProtocolImageInputAdapter

  - name: top
    type: camera
    parent_component: robot
    frame: top_camera
    description: Top camera
    enabled: ${components.top_camera.enabled}
    observations:
      - name: image
        type: image
        description: Top camera image
        frame_rate: 30
