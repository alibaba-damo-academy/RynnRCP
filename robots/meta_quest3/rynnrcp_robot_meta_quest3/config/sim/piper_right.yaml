manifest:
  robot_name: Meta Quest 3 → AgileX Piper
components:
  robot:
    target_model: piper
    target_urdf: package://rynnrcp_robot_meta_quest3/models/piper.urdf
    target_dof: 6
    has_gripper: false
    base_link: base_link
    tip_link: link6
    controller_side: right
    # Web 仿真中部姿态，用于获得双向 Cartesian 调试空间。
    home_joint_positions: [0.0, 0.79, -0.59, -0.41, -0.04, 0.0]
    workspace_delta_limits_m:
      - [-0.25, 0.25]
      - [-0.25, 0.25]
      - [-0.25, 0.25]
    translation_scale: 1.0
