manifest:
  robot_name: Meta Quest 3 → OpenArm
components:
  robot:
    target_model: openarm
    target_urdf: package://rynnrcp_robot_meta_quest3/models/openarm.urdf
    target_dof: 7
    has_gripper: false
    base_link: base
    tip_link: EE
    controller_side: right
    # Web 仿真中部姿态，用于获得双向 Cartesian 调试空间。
    home_joint_positions: [0.0, -0.16, 0.31, 1.57, 0.15, -0.12, 0.0]
    workspace_delta_limits_m:
      - [-0.18, 0.18]
      - [-0.18, 0.18]
      - [-0.18, 0.18]
    translation_scale: 0.75
