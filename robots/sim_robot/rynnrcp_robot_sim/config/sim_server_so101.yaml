# SO101 Simulation Server Config (6 DOF, 2 cameras)
config_type: rynnrcp_server_config
version: 1

manifest:
  robot_id: so101_sim
  robot_name: SO101 Simulation
  capabilities:
    observations: true
    actions: true
    health: true
    resources: true
    data_collection: true
    policy_service: false

integration:
  config: package://rynnrcp_robot_sim/config/robot_integration_so101.yaml

components:
  robot:
    enabled: true
    robot_id: robot
    n_dof: 6
    server_host: localhost
    server_port: 8080
  front_camera:
    enabled: true
    device_id: camera_front
  wrist_camera:
    enabled: true
    device_id: camera_wrist
