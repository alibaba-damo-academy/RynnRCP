config_type: rynnrcp_server_config
version: 1
manifest:
  robot_id: bumi_low
  robot_name: Bumi Low
  capabilities:
    observations: true
    actions: true
    health: true
    resources: true
    data_collection: true
    policy_service: true
integration:
  config: package://rynnrcp_robot_bumi/config/robot_integration_low.yaml
server:
  interface:
    host: 0.0.0.0
    port: 0
    local_registry: true
    mdns: false
components:
  robot:
    enabled: true
    sdk_root: null
    default_kp: 60.0
    default_kd: 3.0
    damping_kd: 0.1
    max_delta: 0.0
policies:
  paths:
    - ../policies
