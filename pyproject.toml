[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rynnrcp"
version = "0.1.0"
description = "RynnRCP runtime framework"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "msgpack>=1.0",
    "grpcio>=1.60",
    "zeroconf>=0.131",
    "lcm==1.5.2",
    "psutil>=5.9",
]

[project.scripts]
rynnrcp-build-native = "rynnrcp.native.build_native:main"
rynnrcp-server = "rynnrcp.cli_server:main"
rynnrcp-protocol-debug = "rynnrcp_app_protocol_debug.protocol_debug_app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = [
    ".",
    "apps/protocol_debug",
]
include = [
    "rynnrcp",
    "rynnrcp.*",
    "rynnrcp_app_protocol_debug",
    "rynnrcp_app_protocol_debug.*",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"rynnrcp.config" = ["*.yaml"]
