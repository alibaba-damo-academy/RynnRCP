[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rynnkit"
version = "0.1.0"
description = "Reusable hardware capability drivers for RynnRCP robot integrations"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
realsense = [
    "pyrealsense2",
]

[tool.setuptools]
packages = ["rynnkit", "rynnkit.cameras"]

[tool.setuptools.package-dir]
rynnkit = "."
"rynnkit.cameras" = "cameras"
